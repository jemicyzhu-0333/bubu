<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>小步 - 强提醒</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'nonce-bubu-fullscreen'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; image-rendering: pixelated;
    font-family: 'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace;
    -webkit-user-select: none; user-select: none;
  }
  html, body { width: 100%; height: 100vh; overflow: hidden; }
  body {
    background: rgba(10, 10, 20, 0.75);
    color: #c0caf5;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.4s ease-out;
    backdrop-filter: blur(2px);
    cursor: pointer;
  }
  @keyframes fadeIn {
    from { opacity: 0; backdrop-filter: blur(0); }
    to { opacity: 1; backdrop-filter: blur(2px); }
  }
  .scanlines {
    position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg,
      rgba(0,0,0,0.2) 0, rgba(0,0,0,0.2) 1px,
      transparent 1px, transparent 3px);
    mix-blend-mode: multiply;
    z-index: 999;
  }
  .card {
    background: #1a1b26;
    border: 4px solid #f7768e;
    box-shadow: 8px 8px 0 rgba(0,0,0,0.7), 0 0 60px rgba(247,118,142,0.4);
    padding: 40px 50px;
    text-align: center;
    max-width: 500px;
    animation: cardPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    z-index: 1;
    cursor: default;
    outline: none;
  }
  @keyframes cardPop {
    0% { transform: scale(0.6) translateY(30px); opacity: 0; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }
  #charCanvas {
    width: 160px; height: 160px;
    filter: drop-shadow(3px 5px 0 rgba(0,0,0,0.6));
    animation: bigBounce 1.5s ease-in-out infinite;
  }
  @keyframes bigBounce {
    0%,100% { transform: translateY(0) rotate(0); }
    25% { transform: translateY(-8px) rotate(-4deg); }
    75% { transform: translateY(-8px) rotate(4deg); }
  }
  .char-name {
    font-size: 12px;
    font-weight: 900;
    color: #e0af68;
    text-shadow: 2px 2px 0 #c07f26;
    letter-spacing: 3px;
    margin-top: 8px;
  }
  .message {
    font-size: 20px;
    font-weight: 900;
    color: #ffffff;
    text-shadow: 3px 3px 0 #1a1b26;
    margin: 20px 0 8px;
    letter-spacing: 1px;
    line-height: 1.6;
  }
  .sub {
    font-size: 11px;
    color: #a9b1d6;
    margin-bottom: 24px;
    letter-spacing: 1px;
  }
  .actions {
    display: flex;
    gap: 12px;
    justify-content: center;
  }
  .pixel-btn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 900;
    padding: 12px 24px;
    cursor: pointer;
    border: 3px solid;
    transition: transform 0.1s, box-shadow 0.1s;
    letter-spacing: 1px;
    box-shadow: 4px 4px 0 rgba(0,0,0,0.7);
    background: #24283b;
    color: #c0caf5;
    border-color: #1a1b26;
    min-height: 44px;
  }
  .pixel-btn.primary {
    background: #f7768e;
    color: #1a1b26;
    border-color: #c53b53;
  }
  .pixel-btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 rgba(0,0,0,0.8); }
  .pixel-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 rgba(0,0,0,0.7); }
  .pixel-btn:focus-visible,
  .card:focus-visible {
    outline: 3px solid #7dcfff;
    outline-offset: 4px;
  }

  .escape-hint {
    position: absolute;
    bottom: 20px; right: 20px;
    font-size: 10px;
    color: #565f89;
  }
  .escape-hint kbd {
    background: #24283b;
    border: 1px solid #2f334d;
    padding: 2px 6px;
    color: #a9b1d6;
    font-family: inherit;
  }

  /* corner sparkles */
  .spark {
    position: absolute;
    font-size: 24px;
    opacity: 0.6;
    animation: sparkle 2s ease-in-out infinite;
  }
  .spark.tl { top: 20px; left: 20px; }
  .spark.tr { top: 20px; right: 20px; animation-delay: 0.5s; }
  .spark.bl { bottom: 60px; left: 20px; animation-delay: 1s; }
  .spark.br { bottom: 60px; right: 20px; animation-delay: 1.5s; }
  @keyframes sparkle {
    0%, 100% { transform: scale(1); opacity: 0.6; }
    50% { transform: scale(1.3) rotate(180deg); opacity: 1; }
  }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0);
    white-space: nowrap; border: 0;
  }

  /* Explicit motion and stimulation profiles. The OS preference is used
     unless the user has deliberately selected full motion. */
  body[data-motion="balanced"] #charCanvas { animation-duration: 2.4s; }
  body[data-motion="balanced"] .spark { animation-duration: 3.2s; }
  body[data-motion="full"] #charCanvas { animation-duration: 1.5s; }

  body[data-motion="reduced"] *,
  body[data-motion="reduced"] *::before,
  body[data-motion="reduced"] *::after {
    animation-duration: 0.01ms !important;
    animation-delay: 0ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  @media (prefers-reduced-motion: reduce) {
    body:not([data-motion="full"]) *,
    body:not([data-motion="full"]) *::before,
    body:not([data-motion="full"]) *::after {
      animation-duration: 0.01ms !important;
      animation-delay: 0ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  body[data-stimulation="low"] {
    background: rgba(10, 10, 20, 0.9);
    backdrop-filter: none;
  }
  body[data-stimulation="low"] .scanlines,
  body[data-stimulation="low"] .spark { display: none; }
  body[data-stimulation="low"] .card {
    box-shadow: 4px 4px 0 rgba(0,0,0,0.7);
  }
  body[data-stimulation="low"] #charCanvas { filter: none; }
  body[data-stimulation="balanced"] .scanlines { opacity: 1; }
  body[data-stimulation="high"] { backdrop-filter: blur(3px); }
  body[data-stimulation="high"] .card {
    box-shadow: 8px 8px 0 rgba(0,0,0,0.7), 0 0 80px rgba(247,118,142,0.55);
  }
</style>
</head>
<body data-motion="reduced" data-stimulation="low">
  <div class="scanlines" aria-hidden="true"></div>
  <div class="card" id="nudgeDialog" role="dialog" aria-modal="true" aria-labelledby="nudgeTitle" aria-describedby="message" tabindex="-1">
    <h1 class="sr-only" id="nudgeTitle">小步 强提醒</h1>
    <div class="spark tl" aria-hidden="true">✦</div>
    <div class="spark tr" aria-hidden="true">✧</div>
    <div class="spark bl" aria-hidden="true">✧</div>
    <div class="spark br" aria-hidden="true">✦</div>
    <canvas id="charCanvas" width="160" height="160" aria-hidden="true"></canvas>
    <div class="char-name" id="charName">· CHARACTER ·</div>
    <div class="message" id="message" aria-live="assertive" aria-atomic="true">...</div>
    <div class="sub">小步 强提醒 · Level 4</div>
    <div class="actions" id="actions" aria-label="提醒操作"></div>
    <div class="escape-hint">按 <kbd>Esc</kbd> 或点击背景关闭</div>
  </div>
<script nonce="bubu-fullscreen">
  const canvas = document.getElementById('charCanvas');
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;

  const CHARACTERS = {
    spider: {
      name: 'PETER',
      grid: [
        '....11111111........',
        '..1111111111111.....',
        '.1111111111111111...',
        '11114411111144111...',
        '11141114111411411...',
        '11141114111411411...',
        '11114411111144111...',
        '11111111112211111...',
        '11111111122211111...',
        '.1111111122211111...',
        '.11111111211111111..',
        '..111111111111111...',
        '...1111111111111....',
        '....11111111111.....',
        '....11.111111.11....',
        '...11...111...11....',
        '..11.....1.....11...',
        '.11............11...',
        '11..............11..',
        '..................'
      ],
      colors: { 1: '#c53b1a', 2: '#1a1b26', 3: '#c0caf5', 4: '#c0caf5' }
    },
    cat: {
      name: 'MOCHI',
      grid: [
        '..1......1..........',
        '.111....111.........',
        '.1112..2111.........',
        '.11122.22111........',
        '.111222.2111........',
        '.11122222111........',
        '.1112222211111......',
        '.111412221411111....',
        '.11122222222211111..',
        '1111222332222211111.',
        '11112222.22222211111',
        '.11122222222222111..',
        '..11122222222211....',
        '...1122222221.......',
        '....11222211........',
        '.....11221..........',
        '....11..11..........',
        '...11....11.........',
        '..11......11........',
        '..................'
      ],
      colors: { 1: '#e0af68', 2: '#f7c98a', 3: '#f7768e', 4: '#1a1b26' }
    },
    robot: {
      name: 'BEEP',
      grid: [
        '......111111........',
        '.....11111111.......',
        '....1111111111......',
        '...111.4444.111.....',
        '...111.4444.111.....',
        '...11144444411......',
        '...11122222211......',
        '....11111111........',
        '..111111111111......',
        '.11122222222111.....',
        '.11122222222111.....',
        '.11122.....2111.....',
        '.11122.....2111.....',
        '.11122333322111.....',
        '.11122222222111.....',
        '.11111111111111.....',
        '..111111111111......',
        '..11........11......',
        '..11........11......',
        '.111........111.....'
      ],
      colors: { 1: '#565f89', 2: '#a9b1d6', 3: '#7dcfff', 4: '#f7768e' }
    }
  };

  function drawCharacter(charId) {
    const c = CHARACTERS[charId] || CHARACTERS.spider;
    const cell = 8;
    ctx.clearRect(0, 0, 160, 160);
    for (let y = 0; y < c.grid.length; y++) {
      for (let x = 0; x < c.grid[y].length; x++) {
        const ch = c.grid[y][x];
        if (ch === '.' || ch === ' ') continue;
        const color = c.colors[ch];
        if (!color) continue;
        ctx.fillStyle = color;
        ctx.fillRect(x * cell, y * cell, cell, cell);
      }
    }
    return c.name;
  }

  function normalizeActions(data) {
    if (Array.isArray(data.actions) && data.actions.length > 0) {
      return data.actions
        .filter(action => action && action.label)
        .map((action, i) => ({
          id: String(action.id || (i === 0 ? 'accept' : i === 1 ? 'defer' : `action-${i}`)),
          label: String(action.label),
          primary: action.primary === true || (action.primary === undefined && i === 0)
        }));
    }
    return (data.actionLabels || ['我知道了']).map((label, i) => ({
      id: i === 0 ? 'accept' : i === 1 ? 'defer' : `action-${i}`,
      label: String(label),
      primary: i === 0
    }));
  }

  function applyNudgeSensoryProfile(data = {}) {
    document.body.dataset.motion = data.motionMode === 'reduced' || data.motionMode === 'full' ? data.motionMode : 'balanced';
    document.body.dataset.stimulation = ['low', 'balanced', 'high'].includes(data.stimulationMode) ? data.stimulationMode : 'balanced';
  }

  window.bubu.onNudgeSensoryProfile(applyNudgeSensoryProfile);

  window.bubu.onNudgeInit((data) => {
    applyNudgeSensoryProfile(data);
    const name = drawCharacter(data.character || 'spider');
    document.getElementById('charName').textContent = '· ' + name + ' ·';
    document.getElementById('message').textContent = data.message || '...';
    const actions = document.getElementById('actions');
    actions.innerHTML = '';
    normalizeActions(data).forEach((action) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'pixel-btn' + (action.primary ? ' primary' : '');
      btn.dataset.actionId = action.id;
      btn.textContent = action.label;
      btn.addEventListener('click', () => {
        window.bubu.dismissNudge(action.id);
      });
      actions.appendChild(btn);
    });
    requestAnimationFrame(() => document.getElementById('nudgeDialog').focus({ preventScroll: true }));
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      e.preventDefault();
      window.bubu.dismissNudge('dismiss');
      return;
    }
    if (e.key === 'Tab') {
      const buttons = Array.from(document.querySelectorAll('#actions button:not(:disabled)'));
      if (buttons.length === 0) {
        e.preventDefault();
        document.getElementById('nudgeDialog').focus({ preventScroll: true });
        return;
      }
      const first = buttons[0];
      const last = buttons[buttons.length - 1];
      if (e.shiftKey && (document.activeElement === first || document.activeElement === document.getElementById('nudgeDialog'))) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    }
  });

  document.body.addEventListener('click', (e) => {
    if (!e.target.closest('#nudgeDialog')) window.bubu.dismissNudge('dismiss');
  });
</script>
</body>
</html>
