name: Build Windows and macOS (unsigned)

# Manual only: private repositories may consume paid Actions minutes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            artifact: windows-x64-unsigned
            file: dist/*.exe
          - os: macos-latest
            platform: mac
            arch: arm64
            artifact: macos-arm64-unsigned
            file: dist/*.dmg
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci
      - name: Verify packaging command selection
        run: node --test test/build-app.test.js
      - name: Build unsigned installer without publishing
        run: npm run build:${{ matrix.platform }} -- --${{ matrix.arch }}
      - name: Store installer for manual download
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: ${{ matrix.file }}
          if-no-files-found: error
          retention-days: 7
