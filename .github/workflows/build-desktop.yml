name: Diagnose Windows runtime-only profile
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime-fixture:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Observe disposable native Electron runtime structure
        run: node scripts/probe-windows-runtime-fixture.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-runtime-fixture-${{ github.sha }}
          path: dist/windows-runtime-fixture.json
          if-no-files-found: error
          retention-days: 7
