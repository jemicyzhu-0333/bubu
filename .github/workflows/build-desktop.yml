name: Build Windows and macOS (test)

# Manual only: private repositories may consume paid Actions minutes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
            artifact: windows-x64-unsigned
            file: dist/*.exe
          - os: macos-latest
            platform: mac
            arch: arm64
            artifact: macos-arm64-adhoc
            file: dist/*.dmg
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci
      - name: Audit the locked dependency tree
        run: npm audit --audit-level=low
      - name: Check native admission permissions and builder schema early
        run: node --test test/config-admission-permissions.test.js test/build-schema.test.js
      - name: Verify native macOS pet viewport without resizing
        if: matrix.platform == 'mac'
        run: npm run verify:pet-viewport
      - name: Check tests, architecture and generated resources
        run: npm run check
      - name: Check integration contracts
        run: npm run test:integration
      - name: Verify installed packaging dependencies, configuration and command selection
        run: node --test test/build-app.test.js test/build-dependency-security.test.js test/build-schema.test.js
      - name: Build test installer without publishing
        run: npm run build:${{ matrix.platform }} -- --${{ matrix.arch }}
      - name: Verify macOS bundle architecture and package identity
        if: matrix.platform == 'mac'
        run: npm run verify:mac-app
      - name: Report macOS bundle signing identity and actual entitlements
        if: matrix.platform == 'mac'
        run: |
          /usr/bin/codesign --display --verbose=4 "dist/mac-arm64/I’m ADHDer.app"
          /usr/bin/codesign --display --entitlements :- "dist/mac-arm64/I’m ADHDer.app"
      - name: Verify macOS DMG copy, code integrity and disposable-profile launch
        if: matrix.platform == 'mac'
        run: npm run verify:mac-install
      - name: Store allowlisted macOS startup failure diagnostic
        if: failure() && matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: macos-startup-diagnostic-${{ github.sha }}
          path: dist/macos-install-diagnostic.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Report local macOS distribution policy separately from runtime verification
        if: matrix.platform == 'mac'
        run: node scripts/assess-macos-distribution.js
      - name: Store installer for manual download
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: ${{ matrix.file }}
          if-no-files-found: error
          retention-days: 7
